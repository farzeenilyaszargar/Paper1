[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper1-reasoning-data"
version = "0.1.0"
description = "Reproducible, audited symbolic inference datasets"
requires-python = ">=3.11"
dependencies = ["z3-solver==4.15.4.0"]

[project.optional-dependencies]
experiments = ["torch==2.14.1", "numpy==2.5.4", "matplotlib==3.11.2"]

[project.scripts]
reasoning-data = "synthetic_dataset_generator.cli:main"

[tool.setuptools.packages.find]
include = ["synthetic_dataset_generator*", "models*"]
exclude = ["models.runs*"]

[tool.setuptools.package-data]
synthetic_dataset_generator = ["configs/*.json"]
models = ["experiment_protocol.json"]
